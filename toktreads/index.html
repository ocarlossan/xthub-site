<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apresentação TokThreads</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#12372A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   TokThreads, apresentação de negócio.
   Identidade da casa: verde profundo, creme, carmim. Um slide por vez, com
   transição e gráfico que cresce do zero quando o slide entra.
   ========================================================================== */
:root{
  --cream:#FFFDF8; --green:#12372A; --green2:#38554A; --green3:#4F625A;
  --crimson:#D9204F; --crimson2:#B9163F; --mint:#C8F3EE; --mint2:#DFF5F1;
  --yellow:#FFE95C; --sand:#F8F4E9;
  --linha:rgba(18,55,42,.16); --linha2:rgba(18,55,42,.28);
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
body{background:var(--green);color:var(--green);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}

/* ------------------------------------------------------------------ menu */
#topo{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;
  gap:18px;padding:14px clamp(18px,4vw,44px);background:rgba(255,253,248,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
#topo .lg{height:26px;width:auto;display:block;flex:none}
#menu{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
#menu button{background:none;border:none;font:inherit;font-size:12.5px;font-weight:500;
  color:var(--green3);padding:7px 11px;border-radius:8px;cursor:pointer;
  transition:background .2s,color .2s;white-space:nowrap}
#menu button:hover{background:rgba(18,55,42,.07);color:var(--green)}
#menu button.on{background:var(--green);color:var(--cream)}
#hamburguer{display:none;margin-left:auto;background:none;border:1px solid var(--linha2);
  border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;color:var(--green);cursor:pointer}
@media (max-width:1080px){
  #menu{position:fixed;top:57px;left:0;right:0;background:var(--cream);flex-direction:column;
    gap:0;padding:8px;border-bottom:1px solid var(--linha);display:none}
  #menu.aberto{display:flex}
  #menu button{text-align:left;font-size:15px;padding:11px 14px;border-radius:0}
  #hamburguer{display:block}
}

/* ----------------------------------------------------------------- palco */
#palco{position:relative;height:100vh;width:100%;overflow:hidden}
.slide{position:absolute;inset:0;padding:clamp(84px,11vh,120px) clamp(24px,6vw,92px) clamp(74px,10vh,96px);
  display:flex;flex-direction:column;justify-content:center;background:var(--cream);
  opacity:0;transform:translateX(34px);pointer-events:none;
  transition:opacity .6s ease,transform .6s cubic-bezier(.25,1,.5,1);overflow-y:auto}
.slide.ativo{opacity:1;transform:none;pointer-events:auto;z-index:2}
.slide.saiu{transform:translateX(-34px)}
.slide.centro{align-items:center;text-align:center;justify-content:center}
.env{width:100%;max-width:1120px;margin:0 auto}

.mintbg{background:var(--mint2)} .creamsand{background:var(--sand)}
.greenbg{background:var(--green);color:var(--cream)}
.greenbg .eb{color:rgba(255,253,248,.6)} .greenbg .sub{color:rgba(255,253,248,.84)}
.greenbg .box{background:rgba(255,253,248,.07);border-color:rgba(255,253,248,.18)}
.greenbg .box h3,.greenbg .box .num{color:var(--cream)}
.greenbg .box p{color:rgba(255,253,248,.78)}
.greenbg .mini{color:rgba(255,253,248,.6)}

/* ------------------------------------------------------------ tipografia */
.eb{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--green3);margin-bottom:16px;display:block}
h1{font-size:clamp(34px,5.4vw,72px);line-height:1.04;letter-spacing:-.038em;font-weight:700;
  text-wrap:balance}
h2{font-size:clamp(25px,3.5vw,46px);line-height:1.1;letter-spacing:-.03em;font-weight:700;
  text-wrap:balance;max-width:20ch}
h2.wide{max-width:26ch}
.markY{background:var(--yellow);padding:0 .12em;border-radius:4px;color:var(--green)}
.sub{font-size:clamp(14.5px,1.35vw,19px);line-height:1.55;color:var(--green2);max-width:60ch;
  margin-top:14px}
.stamp{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--green3)}
.greenbg .stamp{color:rgba(255,253,248,.55)}
.mini{font-size:12.5px;line-height:1.6;color:var(--green3)}
.tag{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;padding:9px 20px;border-radius:99px;background:var(--yellow);
  color:var(--green);font-weight:700}

/* ---------------------------------------------------------------- caixas */
.col{display:grid;gap:14px;width:100%;margin-top:18px}
.c2{grid-template-columns:repeat(2,1fr)} .c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.c3,.c4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.c2,.c3,.c4{grid-template-columns:1fr}}

.box{background:var(--cream);border:1px solid var(--linha);border-radius:14px;padding:20px 19px;
  opacity:0;transform:translateY(16px);
  transition:opacity .55s ease var(--d,0s),transform .55s cubic-bezier(.25,1,.5,1) var(--d,0s)}
.ativo .box{opacity:1;transform:none}
.mintbg .box{background:var(--cream)}
.box .num{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--green3);display:block;margin-bottom:9px}
.box h3{font-family:var(--mono);font-size:clamp(21px,2.5vw,31px);font-weight:700;
  letter-spacing:-.025em;line-height:1.1;color:var(--green);font-variant-numeric:tabular-nums}
.box p{font-size:13.5px;line-height:1.5;color:var(--green2);margin-top:9px}
.box.hot{background:var(--crimson);border-color:var(--crimson)}
.box.hot h3,.box.hot .num{color:#fff} .box.hot p{color:rgba(255,255,255,.9)}
.box.sun{background:var(--yellow);border-color:rgba(18,55,42,.2)}
.box.sun h3,.box.sun p{color:var(--green)}
.box.txt h3{font-family:var(--sans);font-size:17px;letter-spacing:-.012em}

/* ---------------------------------------------------------------- lista */
.lista{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.lista .x{display:flex;gap:13px;align-items:flex-start;background:var(--cream);
  border:1px solid var(--linha);border-radius:12px;padding:15px 18px;
  opacity:0;transform:translateY(14px);
  transition:opacity .5s ease var(--d,0s),transform .5s cubic-bezier(.25,1,.5,1) var(--d,0s)}
.ativo .lista .x{opacity:1;transform:none}
.lista i{font-style:normal;color:var(--crimson);font-weight:700;flex:none;font-size:15px;
  line-height:1.5}
.lista span{font-size:15px;line-height:1.5;color:var(--green2)}
.lista b{color:var(--green);font-weight:700}

/* ------------------------------------------------------------ gráficos */
.graf{margin:6px 0 12px}
.graf svg{width:100%;height:auto;display:block;overflow:visible}

.traco{stroke-dasharray:2400;stroke-dashoffset:2400;
  transition:stroke-dashoffset 2.3s cubic-bezier(.25,1,.5,1) .25s}
.ativo .traco{stroke-dashoffset:0}
.areaC{opacity:0;transition:opacity 1.1s ease .8s}
.ativo .areaC{opacity:1}
.pontaC{opacity:0;transform:scale(0);transform-origin:center;
  transition:opacity .35s ease 1.9s,transform .5s cubic-bezier(.68,-.55,.27,1.55) 1.9s}
.ativo .pontaC{opacity:1;transform:scale(1)}

.faixa{transform:scaleX(0);transform-origin:left center;
  transition:transform 1.1s cubic-bezier(.25,1,.5,1) var(--d,0s)}
.ativo .faixa{transform:scaleX(1)}
.rotFaixa{opacity:0;transition:opacity .5s ease var(--d,0s)}
.ativo .rotFaixa{opacity:1}

.colB{transform:scaleY(0);transform-origin:bottom;
  transition:transform 1.2s cubic-bezier(.25,1,.5,1) var(--d,0s)}
.ativo .colB{transform:scaleY(1)}
.rotB{opacity:0;transition:opacity .5s ease var(--d,0s)}
.ativo .rotB{opacity:1}

/* --------------------------------------------------------------- rodapé */
#rodape{position:fixed;bottom:0;left:0;right:0;z-index:70;display:flex;align-items:center;
  gap:16px;padding:12px clamp(18px,4vw,44px);background:rgba(255,253,248,.92);
  backdrop-filter:blur(10px);border-top:1px solid var(--linha)}
#pontos{display:flex;gap:7px;margin:0 auto}
#pontos b{width:7px;height:7px;border-radius:50%;background:rgba(18,55,42,.2);border:none;
  padding:0;cursor:pointer;transition:background .25s,transform .25s}
#pontos b.on{background:var(--crimson);transform:scale(1.45)}
.setas{display:flex;gap:8px}
.setas button{width:36px;height:36px;border-radius:10px;border:1px solid var(--linha2);
  background:var(--cream);color:var(--green);font-size:16px;line-height:1;cursor:pointer;
  display:grid;place-items:center;transition:background .2s,border-color .2s}
.setas button:hover:not(:disabled){background:var(--green);color:var(--cream);border-color:var(--green)}
.setas button:disabled{opacity:.32;cursor:default}
#conta{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--green3);
  font-variant-numeric:tabular-nums;min-width:62px;text-align:right}

:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  .box,.lista .x,.rotFaixa,.rotB,.areaC,.pontaC{opacity:1;transform:none}
  .traco{stroke-dashoffset:0} .faixa{transform:scaleX(1)} .colB{transform:scaleY(1)}
}
</style>
</head>

const SANS = "DM Sans, Helvetica, Arial, sans-serif";
const MONO = "Roboto Mono, monospace";
const G = "#12372A", C = "#D9204F";

/* A curva do GMV: o traço se desenha, a área aparece atrás, o ponto final
   estoura por último. */
const CURVA = (function () {
  const pts = [[0,296],[83,295],[167,293],[250,290],[333,286],[417,280],[500,270],
               [583,257],[667,238],[750,210],[833,170],[917,112],[1000,26]];
  const linha = pts.map((p) => p[0] + "," + p[1]).join(" ");
  let g = '<svg viewBox="0 0 1000 340" role="img" aria-label="Crescimento do GMV médio diário do TikTok Shop no Brasil, 102 vezes em doze meses">';
  g += '<title>Crescimento do GMV médio diário no primeiro ano no Brasil</title>';
  g += '<defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">' +
       '<stop offset="0" stop-color="' + C + '" stop-opacity=".26"/>' +
       '<stop offset="1" stop-color="' + C + '" stop-opacity="0"/></linearGradient></defs>';
  for (let k = 1; k <= 3; k++) {
    const y = 300 - k * 68;
    g += '<line x1="0" y1="' + y + '" x2="1000" y2="' + y + '" stroke="rgba(18,55,42,.09)" stroke-width="1"></line>';
  }
  g += '<path class="areaC" d="M0,300 L' + linha.split(" ").join(" L") + ' L1000,300 Z" fill="url(#gArea)"></path>';
  g += '<polyline class="traco" points="' + linha + '" fill="none" stroke="' + C +
       '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></polyline>';
  g += '<line x1="0" y1="300" x2="1000" y2="300" stroke="rgba(18,55,42,.3)" stroke-width="1.5"></line>';
  g += '<circle class="pontaC" cx="1000" cy="26" r="9" fill="' + C + '"></circle>';
  g += '<text x="0" y="326" fill="rgba(18,55,42,.6)" font-size="17" font-family="' + SANS + '">maio 2025</text>';
  g += '<text x="1000" y="326" fill="rgba(18,55,42,.6)" font-size="17" font-family="' + SANS + '" text-anchor="end">maio 2026</text>';
  g += '<text x="962" y="18" fill="' + C + '" font-size="36" font-weight="700" font-family="' + SANS + '" text-anchor="end">102x</text>';
  g += "</svg>";
  return g;
})();

/* Os três mercados: cada faixa cresce da esquerda, uma depois da outra, e a
   defasagem fica visível no próprio atraso da animação. */
const ONDA = (function () {
  const m = [["Estados Unidos", "onde a onda começa", 0, C],
             ["Reino Unido", "validação europeia", 120, "#38554A"],
             ["Brasil", "onde você vende", 300, G]];
  let g = '<svg viewBox="0 0 1000 260" role="img" aria-label="Defasagem entre os três mercados">';
  g += '<title>O formato que vende nos Estados Unidos chega ao Brasil meses depois</title>';
  m.forEach((r, k) => {
    const y = 26 + k * 78, atraso = (k * 0.22).toFixed(2) + "s";
    g += '<rect x="0" y="' + y + '" width="1000" height="50" rx="10" fill="rgba(18,55,42,.07)"></rect>';
    g += '<rect class="faixa" style="--d:' + atraso + ';transform-origin:' + r[2] + 'px center" x="' + r[2] +
         '" y="' + y + '" width="' + (1000 - r[2] - 10) + '" height="50" rx="10" fill="' + r[3] +
         '" opacity="' + (k === 2 ? 1 : .28) + '"></rect>';
    g += '<text class="rotFaixa" style="--d:' + ((k * 0.22) + 0.5).toFixed(2) + 's" x="' + (r[2] + 20) +
         '" y="' + (y + 31) + '" fill="' + (k === 2 ? "#FFFDF8" : G) + '" font-size="20" font-weight="700" font-family="' + SANS + '">' + r[0] + '</text>';
    g += '<text class="rotFaixa" style="--d:' + ((k * 0.22) + 0.6).toFixed(2) + 's" x="' + (r[2] + 20) +
         '" y="' + (y + 68) + '" fill="rgba(18,55,42,.55)" font-size="15" font-family="' + MONO + '">' + r[1] + '</text>';
  });
  g += "</svg>";
  return g;
})();

/* Projeção: a coluna cresce do chão e o valor conta junto. */
const BARRAS = (function () {
  const d = [["Ano 1", 6.9, "8.560 assinantes*"],
             ["Ano 2", 36.1, "36.300 assinantes*"],
             ["Ano 3", 206, "128.400 assinantes*"]];
  let g = '<svg viewBox="0 0 1000 350" role="img" aria-label="Projeção de receita anual em três anos">';
  g += "<title>Projeção de receita anual</title>";
  const base = 274, maxh = 226;
  d.forEach((b, k) => {
    const h = Math.max((b[1] / 210) * maxh, 10), x = 96 + k * 296;
    const atraso = (k * 0.2).toFixed(2) + "s";
    g += '<rect class="colB" style="--d:' + atraso + '" x="' + x + '" y="' + (base - h) +
         '" width="196" height="' + h + '" rx="10" fill="' + (k === 2 ? C : "rgba(217,32,79,.35)") + '"></rect>';
    g += '<text class="rotB" style="--d:' + (k * 0.2 + 0.5).toFixed(2) + 's" x="' + (x + 98) +
         '" y="' + (base - h - 18) + '" fill="' + G + '" font-size="31" font-weight="700" font-family="' + SANS +
         '" text-anchor="middle" data-alvo="' + b[1] + '" data-pre="R$ " data-suf=" mi' + (k === 2 ? "*" : "") +
         '" data-dec="' + (b[1] % 1 === 0 ? "0" : "1") + '">R$ 0 mi</text>';
    g += '<text class="rotB" style="--d:' + (k * 0.2 + 0.6).toFixed(2) + 's" x="' + (x + 98) + '" y="' + (base + 32) +
         '" fill="rgba(18,55,42,.75)" font-size="19" font-weight="700" font-family="' + SANS + '" text-anchor="middle">' + b[0] + '</text>';
    g += '<text class="rotB" style="--d:' + (k * 0.2 + 0.7).toFixed(2) + 's" x="' + (x + 98) + '" y="' + (base + 58) +
         '" fill="rgba(18,55,42,.55)" font-size="16" font-family="' + SANS + '" text-anchor="middle">' + b[2] + '</text>';
  });
  g += '<line x1="60" y1="274" x2="940" y2="274" stroke="rgba(18,55,42,.3)" stroke-width="1.5"></line>';
  g += "</svg>";
  return g;
})();

/* ------------------------------------------------------------- montagem */
const palco = document.getElementById("palco");
const pontos = document.getElementById("pontos");
const menu = document.getElementById("menu");
const conta = document.getElementById("conta");
const btAnt = document.getElementById("ant"), btProx = document.getElementById("prox");

S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide " + (s.classe || "");
  el.innerHTML = s.html;
  palco.appendChild(el);

  const p = document.createElement("button");
  p.type = "button";
  p.setAttribute("aria-label", "Slide " + (i + 1));
  p.addEventListener("click", () => ir(i));
  pontos.appendChild(p);

  if (s.menu) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = s.menu; b.dataset.i = i;
    b.addEventListener("click", () => { ir(i); menu.classList.remove("aberto"); });
    menu.appendChild(b);
  }
});
const slides = [...palco.children];
const bolinhas = [...pontos.children];
const itensMenu = [...menu.children];

/* Número que sobe do zero. A rede de segurança existe porque o navegador
   congela o requestAnimationFrame em aba de segundo plano, e o número ficaria
   parado no zero do HTML. */
function contar(el) {
  const fim = parseFloat(el.dataset.alvo);
  const dec = parseInt(el.dataset.dec || "0", 10);
  const pre = el.dataset.pre || "", suf = el.dataset.suf || "";
  const dur = 1200, t0 = performance.now();
  const fmt = (v) => pre + v.toLocaleString("pt-BR",
    { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
  const passo = (t) => {
    const p = Math.min((t - t0) / dur, 1);
    el.textContent = fmt(fim * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
  setTimeout(() => { if (el.textContent !== fmt(fim)) el.textContent = fmt(fim); }, dur + 400);
}

let atual = -1;
function ir(i) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === atual) return;
  slides.forEach((s, k) => {
    s.classList.toggle("ativo", k === i);
    s.classList.toggle("saiu", k < i);
  });
  bolinhas.forEach((b, k) => b.classList.toggle("on", k === i));
  itensMenu.forEach((b) => b.classList.toggle("on", Number(b.dataset.i) === i));
  conta.textContent = String(i + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
  btAnt.disabled = i === 0;
  btProx.disabled = i === slides.length - 1;
  atual = i;

  // Os contadores rodam a cada entrada: quem volta um slide vê de novo.
  slides[i].querySelectorAll("[data-alvo]").forEach((n) => {
    const dono = n.closest("[style*='--d']");
    const atraso = dono ? parseFloat(getComputedStyle(dono).getPropertyValue("--d")) || 0 : 0;
    setTimeout(() => contar(n), atraso * 1000 + 140);
  });
  history.replaceState(null, "", "#" + (i + 1));
}

btAnt.addEventListener("click", () => ir(atual - 1));
btProx.addEventListener("click", () => ir(atual + 1));
document.getElementById("hamburguer").addEventListener("click", (e) => {
  const aberto = menu.classList.toggle("aberto");
  e.currentTarget.setAttribute("aria-expanded", String(aberto));
});

addEventListener("keydown", (e) => {
  const passos = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, " ": 1,
                   ArrowLeft: -1, ArrowUp: -1, PageUp: -1 };
  if (e.key in passos) { e.preventDefault(); ir(atual + passos[e.key]); }
  if (e.key === "Home") { e.preventDefault(); ir(0); }
  if (e.key === "End") { e.preventDefault(); ir(slides.length - 1); }
});

/* Rolagem e deslize também navegam, com trava para não pular vários de uma vez. */
let travado = false;
addEventListener("wheel", (e) => {
  if (travado || Math.abs(e.deltaY) < 24) return;
  const alvo = slides[atual];
  if (alvo.scrollHeight > alvo.clientHeight + 8) {
    const fim = alvo.scrollTop + alvo.clientHeight >= alvo.scrollHeight - 4;
    const topo = alvo.scrollTop <= 2;
    if ((e.deltaY > 0 && !fim) || (e.deltaY < 0 && !topo)) return;
  }
  travado = true; setTimeout(() => { travado = false; }, 700);
  ir(atual + (e.deltaY > 0 ? 1 : -1));
}, { passive: true });

let toqueY = null;
addEventListener("touchstart", (e) => { toqueY = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", (e) => {
  if (toqueY === null) return;
  const d = toqueY - e.changedTouches[0].clientY;
  if (Math.abs(d) > 60) ir(atual + (d > 0 ? 1 : -1));
  toqueY = null;
}, { passive: true });

ir(Math.max(0, (parseInt((location.hash || "#1").slice(1), 10) || 1) - 1));
