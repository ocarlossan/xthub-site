server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/html text/plain text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # A marca se escreve TokThreads, mas o dominio e a pasta vieram sem o "h".
  # Quem digitar a grafia certa nao pode cair em 404.
  location = /tokthreads  { return 301 /toktreads/; }
  location = /tokthreads/ { return 301 /toktreads/; }

  # Apresentacao de negocio: projecao, preco e leitura de concorrencia.
  # Fica fora de buscador e fora de cache compartilhado.
  location /toktreads/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }

  location ~* \.(png|jpg|jpeg|svg|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / { try_files $uri $uri/ =404; }
}
